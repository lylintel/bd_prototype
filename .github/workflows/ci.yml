name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python }} / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-ip.txt
            requirements-parser.txt
            requirements-pyslang.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install HDL tools
        run: |
          sudo apt-get update && sudo apt-get install -y iverilog
          command -v iverilog
          command -v vvp
      - name: Install development dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm --prefix web ci
      - name: Run the same local checks
        run: python scripts/check.py

  pyslang-spike:
    name: Parser / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned portable Yosys
        run: |
          python -m pip install --only-binary=:all: -r requirements-parser.txt
      - name: Install optional pyslang on supported Python
        if: matrix.python != '3.10'
        run: python -m pip install -r requirements-pyslang.txt
      - name: Parse real fixture and compare bytes
        run: python scripts/spike_pyslang.py
      - name: Install parser test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify parser corpus and original goldens
        run: python -m pytest tests/test_ip_parser.py tests/golden -q